<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Acceso privado a EduPro para comunidades educativas autorizadas.">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="EduPro">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Acceso a EduPro | Plataforma escolar</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script>
    (function () {
      var host = window.location.hostname;
      var isLocalhost =
        host === 'localhost' ||
        host === '127.0.0.1' ||
        host === '::1';

      if (isLocalhost) {
        self.FIREBASE_APPCHECK_DEBUG_TOKEN = true;
        console.info('[APP_CHECK] localhost debug token enabled');
      }
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
