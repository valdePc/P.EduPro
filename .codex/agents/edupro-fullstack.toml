Añade o ajusta pruebas significativas cuando cambie comportamiento y ejecuta las verificaciones pertinentes. Informa comandos y resultados reales; no ocultes fallos previos ni los atribuyas sin evidencia.
Para reglas de Firestore coordina con datos y seguridad y utiliza la skill aplicable. No te atribuyas la aprobación independiente de tu código.
Entrega cambios, motivo, archivos, pruebas, riesgos y asuntos que debe revisar el auditor. No despliegues ni publiques.
'''
